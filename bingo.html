<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteio de Bingo</title>
    <meta name="description" content="Aplicativo de sorteio de números de Bingo com modo escuro e síntese de voz.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/bingo.css">
    <script src="scripts/bingo.js" defer></script>
</head>

<body>
    <noscript>JavaScript é necessário para o funcionamento do Bingo.</noscript>

    <button id="darkModeToggle" class="dark-mode-toggle"
            aria-label="Alternar modo noturno"
            aria-pressed="false"
            title="Alternar modo noturno">
        <span aria-hidden="true" class="toggle-icon">☀️</span>
    </button>

    <main class="container">
        <h1>Sorteio de Bingo</h1>

        <section class="sorteio" aria-label="Área de sorteio">
            <button id="btnSortear" class="btn-sortear" title="Sortear número (Espaço ou Enter)">Sortear Número</button>
            <div id="resultado" class="resultado">Clique no botão para sortear</div>
            <div id="bolinha" class="bolinha" style="display:none;"></div>
        </section>

        <div class="contador" aria-live="polite">
            <span id="numeroSorteados">0</span> números sorteados de <span id="totalNumeros"></span>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
        </div>

        <section class="ultimos-sorteados" aria-label="Últimos números sorteados">
            <div>Últimos números sorteados:</div>
            <div class="ultimos-numeros" id="ultimosSorteados"></div>
        </section>

        <section class="historico" aria-label="Cartela de bingo">
            <h2>Cartela de Bingo</h2>
            <div class="tabela-bingo">
                <div class="coluna">
                    <div class="coluna-titulo">B</div>
                    <div class="numeros-sorteados" id="coluna-b"></div>
                </div>
                <div class="coluna">
                    <div class="coluna-titulo">I</div>
                    <div class="numeros-sorteados" id="coluna-i"></div>
                </div>
                <div class="coluna">
                    <div class="coluna-titulo">N</div>
                    <div class="numeros-sorteados" id="coluna-n"></div>
                </div>
                <div class="coluna">
                    <div class="coluna-titulo">G</div>
                    <div class="numeros-sorteados" id="coluna-g"></div>
                </div>
                <div class="coluna">
                    <div class="coluna-titulo">O</div>
                    <div class="numeros-sorteados" id="coluna-o"></div>
                </div>
            </div>

            <div class="reiniciar-container">
                <button id="btnReiniciar" class="reiniciar">Reiniciar Jogo</button>
            </div>
        </section>
    </main>
</body>

</html>
